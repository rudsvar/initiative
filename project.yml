name: initiative
options:
  bundleIdPrefix: xyz.rudsvar
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"

configs:
  Debug:
    settings: {}
  Release:
    settings: {}

targets:
  initiative:
    type: application
    platform: iOS
    sources:
      - path: initiative
        includes:
          - "*.swift"
    resources:
      - path: initiative/Assets.xcassets
    settings:
      PRODUCT_NAME: initiative
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: ""
      GENERATE_INFOPLIST_FILE: YES

schemes:
  initiative:
    build:
      targets:
        initiative: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
