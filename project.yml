name: initiative
options:
  bundleIdPrefix: xyz.rudsvar
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"

configs:
  Debug:
    settings: {}
  Release:
    settings: {}

targets:
  initiative:
    type: application
    platform: iOS
    sources:
      - path: initiative
        includes:
          - "*.swift"
          - "!*Tests.swift"
    resources:
      - path: initiative/Assets.xcassets
    settings:
      PRODUCT_NAME: initiative
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: ""
      GENERATE_INFOPLIST_FILE: YES
    infoPlist:
      UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationPortraitUpsideDown
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
      UISupportedInterfaceOrientationsIPhone:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationPortraitUpsideDown
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
      UIApplicationSceneManifest:
        UIApplicationSupportsMultipleScenes: false
        UISceneConfigurations:
          UIWindowSceneSessionRoleApplication:
            - UISceneConfigurationName: Default Configuration
              UISceneDelegateClassName: ""
      UILaunchScreen:
        UIColorName: ""
        UIImageName: ""
        UIImageRespectsSafeAreaInsets: false

  initiativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: initiative
        includes:
          - "*Tests.swift"
    dependencies:
      - target: initiative

schemes:
  initiative:
    build:
      targets:
        initiative: all
    run:
      config: Debug
    test:
      targets:
        - initiativeTests
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
