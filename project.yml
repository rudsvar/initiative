name: initiative
options:
  bundleIdPrefix: xyz.rudsvar
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

configs:
  Debug:
    settings: {}
  Release:
    settings: {}

targets:
  initiative:
    type: application
    platform: iOS
    sources:
      - path: initiative
        includes:
          - "**/*.swift"
        excludes:
          - "**/*Tests.swift"
      - path: initiative/Assets.xcassets
    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      PRODUCT_NAME: initiative
      # The version users see (1.0). Build numbers are set per upload by CI.
      MARKETING_VERSION: "1.0"
      # Home-screen name only — bundle id, module name, and the Xcode project
      # itself stay "initiative" so this doesn't touch code signing/provisioning
      # or require reinstalling (a bundle id change loses on-device data).
      INFOPLIST_KEY_CFBundleDisplayName: "Instant Initiative"
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
      GENERATE_INFOPLIST_FILE: YES
      # The app uses only the system's HTTPS, so no export-compliance question
      # on every beta or store upload.
      INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      # With GENERATE_INFOPLIST_FILE: YES, Xcode builds Info.plist purely from
      # INFOPLIST_KEY_* build settings — a separate top-level `infoPlist:` dict
      # (as this target used to have) is silently ignored, which is why none of
      # our launch-screen/scene/orientation config ever reached the built app
      # and the app ran letterboxed on-device. Use INFOPLIST_KEY_* only here.
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  initiativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: initiative
        includes:
          - "**/*Tests.swift"
    dependencies:
      - target: initiative
    settings:
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: "NO"
      GENERATE_INFOPLIST_FILE: YES

schemes:
  initiative:
    build:
      targets:
        initiative: all
    run:
      config: Debug
    test:
      targets:
        - initiativeTests
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
